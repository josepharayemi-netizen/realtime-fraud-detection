services:
  redpanda:
    image: redpandadata/redpanda:v24.3.7
    command: redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["19092:9092"]
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  consumer:
    build: .
    command: python -m app.consumer
    environment: [KAFKA_BROKER=redpanda:9092]
    depends_on: [redpanda]
    volumes: ["./data:/app/data"]
  producer:
    build: .
    command: python -m app.producer
    environment: [KAFKA_BROKER=redpanda:9092]
    depends_on: [redpanda]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
